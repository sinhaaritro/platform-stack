---
# tasks/install.yml - Package installation

- name: Install NFS server packages
  ansible.builtin.apt:
    name: "{{ storage_lxc_nfs_packages }}"
    state: present
    update_cache: true

- name: Install Samba packages
  ansible.builtin.apt:
    name: "{{ storage_lxc_samba_packages }}"
    state: present
