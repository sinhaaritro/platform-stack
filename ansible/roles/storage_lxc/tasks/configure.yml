---
# tasks/configure.yml - Ganesha NFS export and Samba share configuration

- name: Ensure export directory exists
  ansible.builtin.file:
    path: "{{ storage_lxc_export_path }}"
    state: directory
    owner: root
    group: root
    mode: "0777"

- name: Create Ganesha config directory
  ansible.builtin.file:
    path: /etc/ganesha
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Ganesha NFS export
  ansible.builtin.template:
    src: ganesha.conf.j2
    dest: /etc/ganesha/ganesha.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nfs-ganesha

- name: Configure Samba share
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: "# {mark} ANSIBLE MANAGED: {{ storage_lxc_samba_share_name }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    block: |
      [{{ storage_lxc_samba_share_name }}]
         path = {{ storage_lxc_export_path }}
         comment = {{ storage_lxc_samba_share_comment }}
         browseable = yes
         read only = no
         guest ok = yes
         create mask = 0777
         directory mask = 0777
         force user = nobody
         force group = nogroup
  notify: Restart smbd
