---
# tasks/service.yml - NFS and Samba service management

- name: Enable and start rpcbind
  ansible.builtin.service:
    name: rpcbind
    state: started
    enabled: true

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true

- name: Enable and start Samba
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true
