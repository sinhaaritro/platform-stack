---
# tasks/configure.yml - NFS client mount

- name: Ensure mount directory exists
  ansible.builtin.file:
    path: "{{ nas_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0777"

- name: Mount NAS share
  ansible.posix.mount:
    path: "{{ nas_mount_path }}"
    src: "{{ nas_server }}:{{ nas_remote_path }}"
    fstype: nfs
    opts: "{{ nas_mount_options }}"
    state: mounted
