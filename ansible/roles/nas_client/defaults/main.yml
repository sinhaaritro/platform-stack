---
# defaults/main.yml - nas_client (NFS client).
#
# No host-specific values are hardcoded here. Each client's mounts come from the
# inventory var `nas_mounts` (generated by OpenTofu from the guest's
# ansible_groups) and are resolved against the provider's `storage.exports`
# at run time — see tasks/configure.yml.

nas_client_packages:
  - nfs-common

# Fallback mount options, used only when a `nas_mounts` entry omits `options`.
nas_client_default_mount_options: "hard,noatime,actimeo=2"

# Packages purged by the (opt-in) cleanup task below.
nas_client_server_packages:
  - nfs-kernel-server
  - samba

# --- Destructive cleanup ------------------------------------------------------
# Purges nfs-kernel-server + samba and deletes /etc/exports. ONLY meant to scrub
# a host that used to be a NAS server; it must NEVER run on the NAS server
# itself (atlas). OFF by default; opt in explicitly.
nas_client_purge_server: false
