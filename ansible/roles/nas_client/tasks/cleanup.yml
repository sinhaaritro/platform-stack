---
# tasks/cleanup.yml - Remove obsolete NAS server components (DESTRUCTIVE).
# Only ever included when `nas_client_purge_server` is true (see tasks/main.yml).

- name: Remove NFS server and Samba packages
  ansible.builtin.apt:
    name: "{{ nas_client_server_packages }}"
    state: absent
    purge: true

- name: Remove stale NFS export configuration
  ansible.builtin.file:
    path: /etc/exports
    state: absent

- name: Remove stale local disk mounts from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\s/data/storage\s'
    state: absent
