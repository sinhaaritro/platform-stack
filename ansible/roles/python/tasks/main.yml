# tasks/main.yml
---
- name: Install Python (Debian)
  ansible.builtin.apt:
    name: "{{ python_packages }}"
    state: present
    update_cache: true
  register: python_apt_install_status
  until: python_apt_install_status is success
  retries: 10
  delay: 5
  when: ansible_facts['os_family'] == "Debian"
  tags: [python, packages]

- name: Install Python (Alpine)
  community.general.apk:
    name: "{{ python_packages_alpine }}"
    state: present
  when: ansible_facts['os_family'] == "Alpine"
  tags: [python, packages]
