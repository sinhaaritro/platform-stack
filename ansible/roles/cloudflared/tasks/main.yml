---
# ansible/roles/cloudflared/tasks/main.yml
- name: Install cloudflared binary
  become: true
  block:
    - name: Download cloudflared binary
      ansible.builtin.get_url:
        url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        dest: /usr/local/bin/cloudflared
        mode: '0755'

- name: Ensure Cloudflare Tunnel config directory
  become: true
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    mode: "0700"

- name: Write Cloudflare Tunnel token file
  become: true
  ansible.builtin.copy:
    dest: /etc/cloudflared/token
    content: "{{ cloudflare_tunnel_token_homelab_tunnel }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - cloudflare_tunnel_token_homelab_tunnel is defined

- name: Install Cloudflare Tunnel service
  become: true
  ansible.builtin.command: >
    cloudflared service install {{ cloudflare_tunnel_token_homelab_tunnel }}
  args:
    creates: /etc/init.d/cloudflared
  when:
    - cloudflare_tunnel_token_homelab_tunnel is defined
  register: cloudflared_install_result
  changed_when: cloudflared_install_result.rc == 0

- name: Ensure cloudflared service is started and enabled
  become: true
  ansible.builtin.service:
    name: cloudflared
    state: started
    enabled: true
  failed_when: false
