---
- name: Resolve data disk device from stable by-id symlink
  ansible.builtin.shell: "readlink -f /dev/disk/by-id/*_drive-{{ mount_item.interface }} 2>/dev/null | head -n1"
  register: storage_setup_device_resolve
  changed_when: false
  failed_when: false
  when: mount_item.interface is defined and mount_item.interface | length > 0

- name: Fail if data disk interface does not resolve to a device
  ansible.builtin.fail:
    msg: "Data disk interface '{{ mount_item.interface }}' not found under /dev/disk/by-id on {{ inventory_hostname }} — refusing to touch any disk"
  when:
    - mount_item.interface is defined and mount_item.interface | length > 0
    - storage_setup_device_resolve.stdout | default('') | trim | length == 0

- name: Set resolved data disk device
  ansible.builtin.set_fact:
    storage_setup_device: >-
      {{ (storage_setup_device_resolve.stdout | default('') | trim)
         if (mount_item.interface is defined and mount_item.interface | length > 0)
         else mount_item.device }}

- name: Check disk device existence
  ansible.builtin.stat:
    path: "{{ storage_setup_device }}"
  register: storage_setup_device_stat

- name: Check if device is already mounted
  ansible.builtin.command: "findmnt -rn -S {{ storage_setup_device }} -o TARGET"
  register: storage_setup_mount_check
  failed_when: false
  changed_when: false
  when: storage_setup_device_stat.stat.exists

- name: Get current filesystem type of device
  ansible.builtin.command: "blkid -s TYPE -o value {{ storage_setup_device }}"
  register: storage_setup_current_fstype
  failed_when: false
  changed_when: false
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''

- name: Unmount device if filesystem change is forced
  ansible.posix.mount:
    path: "{{ mount_item.path }}"
    state: unmounted
  when:
    - storage_setup_device_stat.stat.exists
    - mount_item.force | default(false) | bool
    - storage_setup_current_fstype.stdout | default('') != ''
    - storage_setup_current_fstype.stdout != (mount_item.fstype | default('ext4'))

- name: Stop multipathd to release device holders
  ansible.builtin.systemd:
    name: multipathd
    state: stopped
  failed_when: false
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') != (mount_item.fstype | default('ext4'))

- name: Settle udev events before formatting
  ansible.builtin.command: "udevadm settle"
  changed_when: false
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') != (mount_item.fstype | default('ext4'))

- name: Wipe existing partition table signatures
  ansible.builtin.command: "wipefs -a {{ storage_setup_device }}"
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') == ''

- name: Create filesystem on device
  community.general.filesystem:
    fstype: "{{ mount_item.fstype | default('ext4') }}"
    dev: "{{ storage_setup_device }}"
    force: "{{ mount_item.force | default(omit) }}"
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') != (mount_item.fstype | default('ext4'))

- name: Create mount point directory
  ansible.builtin.file:
    path: "{{ mount_item.path }}"
    state: directory
    mode: "0755"
  when: storage_setup_device_stat.stat.exists

- name: Mount device to path
  ansible.posix.mount:
    path: "{{ mount_item.path }}"
    src: "{{ storage_setup_device }}"
    fstype: "{{ mount_item.fstype | default('ext4') }}"
    state: mounted
  when: storage_setup_device_stat.stat.exists
