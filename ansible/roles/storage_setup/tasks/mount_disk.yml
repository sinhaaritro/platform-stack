---
- name: Check disk device existence
  ansible.builtin.stat:
    path: "{{ mount_item.device }}"
  register: storage_setup_device_stat

- name: Check if device is already mounted
  ansible.builtin.command: "findmnt -rn -S {{ mount_item.device }} -o TARGET"
  register: storage_setup_mount_check
  failed_when: false
  changed_when: false
  when: storage_setup_device_stat.stat.exists

- name: Get current filesystem type of device
  ansible.builtin.command: "blkid -s TYPE -o value {{ mount_item.device }}"
  register: storage_setup_current_fstype
  failed_when: false
  changed_when: false
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''

- name: Unmount device if filesystem change is forced
  ansible.posix.mount:
    path: "{{ mount_item.path }}"
    state: unmounted
  when:
    - storage_setup_device_stat.stat.exists
    - mount_item.force | default(false) | bool
    - storage_setup_current_fstype.stdout | default('') != ''
    - storage_setup_current_fstype.stdout != (mount_item.fstype | default('ext4'))

- name: Stop multipathd to release device holders
  ansible.builtin.systemd:
    name: multipathd
    state: stopped
  failed_when: false
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') != (mount_item.fstype | default('ext4'))

- name: Settle udev events before formatting
  ansible.builtin.command: "udevadm settle"
  changed_when: false
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') != (mount_item.fstype | default('ext4'))

- name: Wipe existing partition table signatures
  ansible.builtin.command: "wipefs -a {{ mount_item.device }}"
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') == ''

- name: Create filesystem on device
  community.general.filesystem:
    fstype: "{{ mount_item.fstype | default('ext4') }}"
    dev: "{{ mount_item.device }}"
    force: "{{ mount_item.force | default(omit) }}"
  when:
    - storage_setup_device_stat.stat.exists
    - storage_setup_mount_check.stdout | default('') == ''
    - storage_setup_current_fstype.stdout | default('') != (mount_item.fstype | default('ext4'))

- name: Create mount point directory
  ansible.builtin.file:
    path: "{{ mount_item.path }}"
    state: directory
    mode: "0755"
  when: storage_setup_device_stat.stat.exists

- name: Mount device to path
  ansible.posix.mount:
    path: "{{ mount_item.path }}"
    src: "{{ mount_item.device }}"
    fstype: "{{ mount_item.fstype | default('ext4') }}"
    state: mounted
  when: storage_setup_device_stat.stat.exists
