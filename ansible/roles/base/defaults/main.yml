# defaults/main.yml

# Timezone
base_user_timezone: "{{ user_timezone | default('UTC') }}"

# Locale settings (Prevents Perl warnings during installs)
base_user_locale: "{{ user_locale | default('en_US.UTF-8') }}"

# Core packages — the intersection of what ALL hosts (LXC + VM) need.
# K8s-specific tools (kubectl, kubeadm, helm) are installed by their own roles.
# Dev/debug extras (vim, htop, etc.) can be added per-host via group_vars.
base_packages:
  - curl
  - tar
  - jq
  - ca-certificates
  - gnupg
  - unattended-upgrades
