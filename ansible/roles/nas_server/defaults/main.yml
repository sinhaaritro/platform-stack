---
# defaults/main.yml - nas_server
#
# Host config is NOT hardcoded: everything the role needs comes from the host's
# inventory var `storage` (generated by OpenTofu from
# `topology.nodes.<node>.storage`). See nas-iac-codification-plan.md §5.
#
# Only behaviour toggles (with safe defaults) live here.
#
# Expected host var `storage`:
#   backend: proxmox | truenas
#   owner:  { uid, gid, dir_mode, file_mode }
#   pools:  [ { name, vdev, disks[], props{}, datasets[], wipe? } ]
#   data_disks: [ { interface, by_id, fstype, path, wipe? } ]
#   exports:    { <share-id>: { pool, path, clients, options } }
#   smb_user:   { name, uid, gid, password? }
#   smb_shares: { <share-id>: { path } }
#   proxmox_storages: [ ... ]
#   backup: { snapshots, scrub, smart, rclone }

# --- Storage safety toggles ---------------------------------------------------
# Create a declared ZFS pool that does not exist (never destroys one).
nas_server_allow_pool_create: true

# --- Backup toggles (minimal-by-default) --------------------------------------
# Per-node `storage.backup.<x>.enabled` overrides these when present.
nas_server_snapshots_enabled: false
nas_server_snapshots_schedule: daily
nas_server_snapshots_keep: 7
nas_server_scrub_schedule_enabled: false
nas_server_smart_monitoring: true
nas_server_offsite_rclone_enabled: false

# --- Offsite rclone secrets (REQUIRED when `storage.backup.rclone.enabled`) ---
# Provided via schema.secret.tfvars -> bridged into the inventory.
nas_server_rclone_crypt_password: ""
nas_server_rclone_crypt_salt: ""

# --- TrueNAS backend ----------------------------------------------------------
# API base URL (e.g. https://zunesha/api/v2.0) and API key. The key is a SECRET
# — supply it via a vault-encrypted inventory fragment / secret tfvars.
nas_server_truenas_api_url: ""
nas_server_truenas_api_key: ""
nas_server_truenas_validate_certs: true
