---
# tasks/main.yml - nas_server: assert contract -> share roots -> dispatch backend.
#
# The role is driven entirely by the host var `storage` (generated by OpenTofu
# from the `topology` block). No values are hardcoded in defaults.

- name: Assert the host declares a storage contract
  ansible.builtin.assert:
    that:
      - storage is defined
      - storage.backend is defined
    fail_msg: >-
      Host '{{ inventory_hostname }}' has no `storage` var. It is generated by
      OpenTofu (schema.tfvars -> topology.nodes.<node>.storage). Apply the
      proxmox_atlas stack and confirm this host is in the `proxmox_node` group.

- name: Configure the Proxmox backend
  ansible.builtin.include_tasks: proxmox.yml
  when: storage.backend == "proxmox"

- name: Configure the TrueNAS backend
  ansible.builtin.include_tasks: truenas.yml
  when: storage.backend == "truenas"

# Proxmox only: runs AFTER the backend so data disks are mounted and share roots
# land on the mounted volume. On TrueNAS the paths ARE datasets (created via the
# API), so this host-file step does not apply.
- name: Ensure share root directories exist
  ansible.builtin.include_tasks: paths.yml
  when: storage.backend == "proxmox"
