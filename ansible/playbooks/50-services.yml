# playbooks/50-services.yml
---
# ==============================================================================
# PLATFORM SERVICES LAYER (guest-level)
# Target: adguard, netbird, cloudflared, nas (client) hosts.
# Purpose: DNS, VPN, tunnel, and storage-CLIENT services. The NAS server
#          (node-local storage) lives in the node layer — 10-node.yml.
# ==============================================================================

# ------------------------------------------------------------------------------
# DNS LAYER — AdGuard Home
# ------------------------------------------------------------------------------
- name: Configure AdGuard Home DNS
  hosts: adguard
  tags: adguard
  become: true
  roles:
    - role: adguard

# ------------------------------------------------------------------------------
# VPN LAYER — NetBird Mesh Client
# ------------------------------------------------------------------------------
- name: Configure NetBird Mesh Client
  hosts: netbird
  tags: netbird
  become: true
  roles:
    - role: netbird

# ------------------------------------------------------------------------------
# TUNNEL LAYER — Cloudflare Tunnel Daemon
# ------------------------------------------------------------------------------
- name: Configure Cloudflare Tunnel Daemon
  hosts: cloudflared
  tags: cloudflared
  become: true
  roles:
    - role: cloudflared

# ------------------------------------------------------------------------------
# STORAGE LAYER — NAS client (NFS mount)
# Mounts a host export (per-host `nas_mounts` / legacy vars). The server side
# is in the node layer (10-node.yml) and runs first.
# ------------------------------------------------------------------------------
- name: Configure NAS client (NFS mount)
  hosts: nas
  tags: nas_client
  become: true
  roles:
    - role: nas_client

