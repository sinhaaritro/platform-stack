# ansible/site.yml
---
# Main entrypoint for the platform-stack project.
#
# Each infrastructure layer lives in its own playbook under playbooks/ and is
# imported here in the order it must run. Importing keeps a single entrypoint
# (task ansible:apply:all) while allowing a layer to be run on its own:
#
#   ansible-playbook -i inventory.d playbooks/20-runtimes.yml
#
# You can still narrow a full run with --limit/-l or --tags/-t.

- name: Foundation Layer
  import_playbook: playbooks/00-foundation.yml

- name: VM Hardening Layer
  import_playbook: playbooks/10-vm-hardening.yml

- name: Application Runtimes Layer
  import_playbook: playbooks/20-runtimes.yml

- name: Kubernetes Layer
  import_playbook: playbooks/30-kubernetes.yml

- name: Platform Services Layer
  import_playbook: playbooks/40-services.yml
