# ansible/site.yml
---
# This is the main playbook for the entire platform-stack project.
# It is organized into "plays", where each play targets a group of hosts
# from the inventory and applies the necessary roles to them.

# ==============================================================================
# PLAY 1: FOUNDATION LAYER
# Target: All Managed Hosts (VMs + LXC Containers)
# Purpose: Universal baseline. Timezone, Locale, Hostname, Core Packages.
# ==============================================================================
- name: Apply Base Configuration
  hosts: vm:lxc
  tags: [base]
  become: true
  roles:
    - role: base # System basics (Timezone, Locales, Packages)

# ==============================================================================
# PLAY 2: DEVELOPER UTILITIES
# Target: Hosts in the 'dev' inventory group (VMs or LXCs).
# Purpose: Interactive/debug tools not needed on production servers.
# ==============================================================================
- name: Install Developer Utilities
  hosts: dev
  tags: [dev]
  become: true
  roles:
    - role: dev # vim, htop, dnsutils, etc.

# ==============================================================================
# PLAY 3: VM HARDENING LAYER
# Target: Virtual Machines Only (Group: vm)
# Purpose: Security, monitoring, user accounts, and disk mounts.
#          Not applied to single-purpose LXC containers.
# ==============================================================================
- name: Apply Security and Monitoring Configuration
  hosts: vm
  tags: [vm]
  become: true
  roles:
    - role: security # SSH Hardening, UFW, Fail2Ban
    - role: monitoring # Node Exporter, QEMU Agent
    - role: users # User creation, Git config, SSH Keys
    - role: storage_setup # Mount additional disks (e.g., /dev/sdb -> /data/storage)

# ==============================================================================
# PLAY 4: DEV/TEST KUBERNETES (KIND)
# Target: Kind (Kubernetes) Server
# Purpose: Ephemeral clusters. Manual app deployment for testing.
# ==============================================================================
- name: Configure Dev Kubernetes (Kind)
  hosts: kind
  tags: kind
  become: true
  roles:
    - role: docker # Runtime Dependency (Must run first)
    - role: k8s_repo # Manage the official Kubernetes Apt repositories.
    - role: kind # Cluster Manager (Provisions the cluster)
    - role: helm # Package Manager (Only installs Helm)

# ==============================================================================
# PLAY 5A: PRODUCTION KUBERNETES (KUBEADM) - CONTROL PLANE BOOTSTRAP
# Target: Control Plane Nodes Only (in kubeadm group)
# Purpose: Init Cluster, Install CNI, Generate Certs
# Serial: 1 ensures HA clusters initialize the 1st node completely
# before the 2nd/3rd node try to join it.
# ==============================================================================
- name: Bootstrap Kubeadm Control Plane
  hosts: "k_control:&kubeadm"
  tags: [k_control, kubeadm]
  become: true
  serial: 1
  roles:
    - role: docker # Ensure Runtime
    - role: k8s_repo # Ensure Repos
    - role: kubeadm # Ensure Binaries/Kernel
    - role: kubeadm_cluster # Execute Init/CNI/Control-Join
    - role: storage_local # Setup Storage Class
    - role: helm # Ensure Helm

# ==============================================================================
# PLAY 5B: PRODUCTION KUBERNETES (KUBEADM) - WORKER JOIN
# Target: Worker Nodes Only (in kubeadm group)
# Purpose: Join the existing healthy cluster
# ==============================================================================
- name: Join Kubeadm Worker Nodes
  hosts: "k_worker:&kubeadm"
  tags: [k_worker, kubeadm]
  become: true
  # Parallel is fine here - all workers can join at once
  roles:
    - role: docker
    - role: k8s_repo
    - role: kubeadm
    - role: kubeadm_cluster # Execute Worker-Join

# ==============================================================================
# PLAY 5C: PRODUCTION KUBERNETES (K3S) - CONTROL PLANE BOOTSTRAP
# Target: Control Plane Nodes Only (in k3s group)
# Purpose: Run K3s Installer, wait for tokens
# ==============================================================================
- name: Bootstrap K3s Control Plane
  hosts: "k_control:&k3s"
  tags: [k_control, k3s]
  become: true
  serial: 1
  roles:
    - role: k3s # Ensure Dependencies/Script
    - role: k3s_cluster # Execute Init/Control-Join
    - role: storage_local # Setup Storage Class
    - role: helm # Ensure Helm

# ==============================================================================
# PLAY 5D: PRODUCTION KUBERNETES (K3S) - WORKER JOIN
# Target: Worker Nodes Only (in k3s group)
# Purpose: Join the existing healthy cluster as agents
# ==============================================================================
- name: Join K3s Worker Nodes
  hosts: "k_worker:&k3s"
  tags: [k_worker, k3s]
  become: true
  roles:
    - role: k3s
    - role: k3s_cluster # Execute Worker-Join

# ==============================================================================
# PLAY 6: PRODUCTION KUBERNETES - MANAGEMENT LAYER
# Target: The Hub Server Only (k_management)
# Purpose: Installs ArgoCD. (UI exposure and Fleet connect delayed).
# ==============================================================================
- name: Configure Management Layer (ArgoCD)
  hosts: k_management:&k_control
  tags: argocd
  become: true
  roles:
    - role: argocd

# ==============================================================================
# PLAY 7: DNS LAYER — AdGuard Home
# Target: AdGuard Home LXC (adguard group)
# ==============================================================================
- name: Configure AdGuard Home DNS
  hosts: adguard
  tags: adguard
  become: true
  roles:
    - role: adguard

# ==============================================================================
# PLAY 8: VPN LAYER — NetBird Mesh Client
# Target: NetBird LXC (netbird group)
# ==============================================================================
- name: Configure NetBird Mesh Client
  hosts: netbird
  tags: netbird
  become: true
  roles:
    - role: netbird

# ==============================================================================
# PLAY 9: TUNNEL LAYER — Cloudflare Tunnel Daemon
# Target: Cloudflared LXC (cloudflared group)
# ==============================================================================
- name: Configure Cloudflare Tunnel Daemon
  hosts: cloudflared
  tags: cloudflared
  become: true
  roles:
    - role: cloudflared

# ==============================================================================
# PLAY 10: STORAGE LAYER — NAS client (NFS mount)
# Target: oceanus VM (nas group). Mounts the host export /WD4TB/shared/v1.
# ==============================================================================
- name: Configure NAS client (NFS mount)
  hosts: nas
  tags: nas
  become: true
  roles:
    - role: nas
