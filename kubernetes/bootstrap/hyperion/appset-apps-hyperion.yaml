apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hyperion-apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        # Waves start above core-infrastructure's max (12) because both sets
        # share project "default" and WaitFor gates are project-scoped.
        # Chain: longhorn(core) -> pg18/couchdb -> authentik -> immich/obsidian
        elements:
          # Tier 4 — datastores (need longhorn, wave 5 in core)
          - app: postgresql-18
            namespace: storage
            serverSideApply: "true"
            replace: "false"
            wave: "13"
            waitFor: "StatefulSet/postgresql-18"
          - app: couchdb
            namespace: storage
            serverSideApply: "true"
            replace: "false"
            wave: "13"
            waitFor: "StatefulSet/couchdb-couchdb"
          # Tier 7 — identity (needs postgresql-18, valkey(core), sealed-secrets(core))
          - app: authentik
            namespace: security
            serverSideApply: "true"
            replace: "false"
            wave: "14"
            waitFor: "Deployment/authentik-server"
          # Tier 9 — end-user apps
          - app: immich
            namespace: personal
            serverSideApply: "true"
            replace: "false"
            wave: "15"
            waitFor: "Deployment/immich-server"
          - app: obsidian
            namespace: personal
            serverSideApply: "true"
            replace: "false"
            wave: "15"
            waitFor: "Deployment/obsidian"
          - app: podinfo
            namespace: podinfo
            serverSideApply: "true"
            replace: "false"
            wave: "15"
            waitFor: "Deployment/podinfo"
  template:
    metadata:
      name: "hyperion-{{.app}}"
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave | default "0"}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/sinhaaritro/platform-stack.git
        targetRevision: HEAD
        path: "kubernetes/clusters/hyperion/{{.app}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply={{.serverSideApply}}
          - Replace={{.replace}}
          - '{{if .waitFor}}WaitFor={{.waitFor}}{{end}}'
        retry:
          limit: 10
          backoff:
            duration: "5s"
            factor: 2
            maxDuration: "3m"
