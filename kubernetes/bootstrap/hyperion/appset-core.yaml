apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-infrastructure
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - clusters: {}
          - list:
              elements:
                # Tier 0 — foundation (no in-cluster deps)
                - app: system-patches
                  namespace: kube-system
                  serverSideApply: "true"
                  replace: "false"
                  wave: "0"
                - app: sealed-secrets
                  namespace: security
                  serverSideApply: "true"
                  replace: "false"
                  wave: "1"
                  waitFor: "Deployment/sealed-secrets"
                - app: prometheus-operator-crds
                  namespace: monitoring
                  serverSideApply: "true"
                  replace: "false"
                  wave: "1"
                - app: velero
                  namespace: backup
                  serverSideApply: "true"
                  replace: "false"
                  wave: "2"
                  waitFor: "Deployment/velero"
                # Tier 1 — platform services (no in-cluster deps)
                - app: cert-manager
                  namespace: networking
                  serverSideApply: "true"
                  replace: "false"
                  wave: "3"
                  waitFor: "Deployment/cert-manager"
                - app: external-secrets
                  namespace: security
                  serverSideApply: "true"
                  replace: "false"
                  wave: "3"
                  waitFor: "Deployment/external-secrets"
                - app: kyverno
                  namespace: security
                  serverSideApply: "true"
                  replace: "false"
                  wave: "3"
                  waitFor: "Deployment/kyverno-admission-controller"
                - app: metallb
                  namespace: networking
                  serverSideApply: "true"
                  replace: "false"
                  wave: "4"
                  waitFor: "Deployment/metallb-controller"
                - app: local-path-disks
                  namespace: storage
                  serverSideApply: "true"
                  replace: "false"
                  wave: "4"
                - app: nfs-provisioner
                  namespace: storage
                  serverSideApply: "true"
                  replace: "false"
                  wave: "4"
                  waitFor: "Deployment/nfs-subdir-external-provisioner"
                - app: longhorn
                  namespace: longhorn-system
                  serverSideApply: "true"
                  replace: "false"
                  wave: "5"
                  waitFor: "Deployment/longhorn-driver-deployer"
                # Tier 2 — network entry
                - app: traefik
                  namespace: networking
                  serverSideApply: "true"
                  replace: "false"
                  wave: "6"
                  waitFor: "Deployment/traefik"
                # - app: external-dns
                #   namespace: external-dns
                #   serverSideApply: "true"
                #   replace: "false"
                #   wave: "6"
                # Tier 3 — object storage
                - app: seaweedfs
                  namespace: storage
                  serverSideApply: "true"
                  replace: "false"
                  wave: "7"
                  waitFor: "StatefulSet/seaweedfs-master,StatefulSet/seaweedfs-filer,StatefulSet/seaweedfs-volume"
                # - app: seaweedtest
                #   namespace: storage-test
                #   serverSideApply: "true"
                #   replace: "false"
                #   wave: "7"
                # - app: rustfs
                #   namespace: storage-test
                #   serverSideApply: "true"
                #   replace: "false"
                #   wave: "6"
                # Tier 4 — datastores + log/metric backends
                - app: valkey
                  namespace: storage
                  serverSideApply: "true"
                  replace: "false"
                  wave: "8"
                  waitFor: "StatefulSet/redis"
                - app: loki
                  namespace: logging
                  serverSideApply: "false"
                  replace: "false"
                  wave: "9"
                  waitFor: "StatefulSet/loki-write,StatefulSet/loki-read,StatefulSet/loki-backend"
                - app: mimir
                  namespace: monitoring
                  serverSideApply: "true"
                  replace: "false"
                  wave: "9"
                  waitFor: "StatefulSet/mimir-ingester,StatefulSet/mimir-compactor,StatefulSet/mimir-store-gateway"
                # Tier 5 — metric emitters + alerting (no app deps)
                - app: node-exporter
                  namespace: monitoring
                  serverSideApply: "true"
                  replace: "false"
                  wave: "10"
                  waitFor: "DaemonSet/node-exporter"
                - app: kube-state-metrics
                  namespace: monitoring
                  serverSideApply: "true"
                  replace: "false"
                  wave: "10"
                  waitFor: "Deployment/kube-state-metrics"
                - app: alertmanager
                  namespace: monitoring
                  serverSideApply: "true"
                  replace: "false"
                  wave: "10"
                  waitFor: "StatefulSet/alertmanager"
                # Tier 6 — monitoring consumers
                - app: grafana
                  namespace: monitoring
                  serverSideApply: "true"
                  replace: "false"
                  wave: "11"
                  waitFor: "Deployment/grafana"
                - app: alloy
                  namespace: monitoring
                  serverSideApply: "true"
                  replace: "false"
                  wave: "11"
                  waitFor: "DaemonSet/alloy"
                  # Tier 9 — end-user apps
                - app: copyparty
                  namespace: copyparty
                  serverSideApply: "true"
                  replace: "false"
                  wave: "12"
                  waitFor: "Deployment/copyparty"

  template:
    metadata:
      name: '{{if eq .name "in-cluster"}}hyperion{{else}}{{.name}}{{end}}-{{.app}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave | default "0"}}'
    spec:
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: "sealed-secrets-key*"
          jsonPointers:
            - /data
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates/0/status
            - /spec/volumeClaimTemplates/0/spec/volumeMode
            - /spec/volumeClaimTemplates/0/apiVersion
            - /spec/volumeClaimTemplates/0/kind
            - /spec/volumeClaimTemplates/0/metadata/creationTimestamp
            - /spec/volumeClaimTemplates/1/status
            - /spec/volumeClaimTemplates/1/spec/volumeMode
            - /spec/volumeClaimTemplates/1/apiVersion
            - /spec/volumeClaimTemplates/1/kind
            - /spec/volumeClaimTemplates/1/metadata/creationTimestamp
            - /spec/volumeClaimTemplates/2/status
            - /spec/volumeClaimTemplates/2/spec/volumeMode
            - /spec/volumeClaimTemplates/2/apiVersion
            - /spec/volumeClaimTemplates/2/kind
            - /spec/volumeClaimTemplates/2/metadata/creationTimestamp
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: bgpadvertisements.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: bgppeers.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: bfdprofiles.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: communities.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: ipaddresspools.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: l2advertisements.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
      project: default
      source:
        repoURL: https://github.com/sinhaaritro/platform-stack.git
        targetRevision: HEAD
        path: 'kubernetes/clusters/{{if eq .name "in-cluster"}}hyperion{{else}}{{.name}}{{end}}/{{.app}}'
      destination:
        server: "{{.server}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply={{.serverSideApply}}
          - Replace={{.replace}}
          - "{{if .waitFor}}WaitFor={{.waitFor}}{{end}}"
        retry:
          limit: 10
          backoff:
            duration: "5s"
            factor: 2
            maxDuration: "3m"
