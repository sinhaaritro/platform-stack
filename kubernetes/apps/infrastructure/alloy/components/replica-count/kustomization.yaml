apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# DaemonSets don't have replicas — they run one pod per eligible node.
# The equivalent control is updateStrategy (how many pods update at once).
patches:
  - target:
      kind: DaemonSet
      name: alloy
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: alloy
      spec:
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
