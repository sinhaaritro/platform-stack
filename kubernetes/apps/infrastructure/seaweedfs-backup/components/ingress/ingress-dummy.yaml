apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-volume-dummy
  namespace: storage
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - volume.seaweedfs-dummy.example.com
        - "*.volume.seaweedfs-dummy.example.com"
      secretName: seaweedfs-volume-dummy-tls
  rules:
    - host: volume.seaweedfs-dummy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-volume
                port:
                  number: 8080
    - host: "*.volume.seaweedfs-dummy.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-volume
                port:
                  number: 8080
