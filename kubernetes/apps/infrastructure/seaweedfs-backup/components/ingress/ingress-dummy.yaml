apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-master-dummy
  namespace: storage
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - seaweedfs-dummy.example.com
      secretName: seaweedfs-master-dummy-tls
  rules:
    - host: seaweedfs-dummy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-master
                port:
                  number: 9333
---
