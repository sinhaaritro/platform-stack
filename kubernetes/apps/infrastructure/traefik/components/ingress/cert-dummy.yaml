apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dummy
  namespace: networking
  labels:
    backuplabel.certificate: "true"
spec:
  secretName: traefik-dummy-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "traefik.example.com"
  commonName: traefik.example.com
  secretTemplate:
    labels:
      backuplabel.certificate: "true"
