apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-18
spec:
  serviceName: postgresql-18
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql-18
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-18
    spec:
      containers:
        - name: postgres
          image: postgres:18.4-bookworm
          command:
            - /bin/sh
            - -ec
            - |
              PRELOAD_LIBS=""
              for f in /etc/pg-extensions.d/*/install.sh; do
                if [ -f "$f" ]; then . "$f"; fi
              done
              exec docker-entrypoint.sh postgres ${PRELOAD_LIBS:+ -c shared_preload_libraries="$PRELOAD_LIBS"}
          env:
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
