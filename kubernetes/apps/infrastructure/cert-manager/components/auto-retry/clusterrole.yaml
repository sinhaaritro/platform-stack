apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-retry-role
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "orders", "certificaterequests"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
