apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/instance=grafana"
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
      spec:
        template:
          spec:
            containers:
              - name: grafana
                startupProbe:
                  httpGet:
                    path: /api/health
                    port: grafana
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
                readinessProbe:
                  httpGet:
                    path: /api/health
                    port: grafana
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
                livenessProbe:
                  httpGet:
                    path: /api/health
                    port: grafana
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
