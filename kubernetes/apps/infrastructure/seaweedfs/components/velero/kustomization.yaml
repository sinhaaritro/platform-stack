apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: storage

resources:
  - job.yaml

replacements:
  - source:
      kind: StatefulSet
      name: seaweedfs-master
      fieldPath: spec.template.spec.containers.0.image
    targets:
      - select:
          kind: Job
          name: s3-velero-provision
        fieldPaths:
          - spec.template.spec.containers.0.image
