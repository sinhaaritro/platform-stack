apiVersion: batch/v1
kind: Job
metadata:
  name: s3-velero-provision
  namespace: storage
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      annotations:
        platform.stack/revision: "1"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: s3-provision
          image: seaweedfs-placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: velero-s3
                  key: access_key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: velero-s3
                  key: secret_key
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for SeaweedFS Master..."
              MASTER="seaweedfs-master:9333"

              until echo "s3.bucket.list" | weed shell -master=$MASTER >/dev/null 2>&1; do
                echo "Waiting for master at $MASTER..."
                sleep 2
              done

              echo "Configuring S3 user velero..."
              weed shell -master=$MASTER <<EOF
              s3.configure -user=velero -access_key=$S3_ACCESS_KEY -secret_key=$S3_SECRET_KEY -actions=Read,Write,List,Tagging -apply
              EOF

              # Remove the legacy literal key left behind by the old s3-config
              # job, whose heredoc failed to expand \$VELERO_ACCESS_KEY and stored
              # the literal string as the access key.
              echo "Cleaning up legacy literal access keys..."
              echo "s3.accesskey.list -user=velero" | weed shell -master=$MASTER 2>/dev/null \
                | awk 'NR>1 {print $1}' \
                | while read -r K; do
                    case "$K" in
                      "$S3_ACCESS_KEY") ;;
                      *) echo "Deleting stale key: $K"; echo "s3.accesskey.delete -user=velero -access_key=$K" | weed shell -master=$MASTER ;;
                    esac
                  done

              echo "Creating scoped buckets..."
              for BUCKET in velero; do
                if ! echo "s3.bucket.list" | weed shell -master=$MASTER | grep -q "$BUCKET"; then
                  echo "Creating bucket $BUCKET for user velero..."
                  echo "s3.bucket.create -name=$BUCKET -owner=velero" | weed shell -master=$MASTER
                else
                  echo "Bucket $BUCKET already exists."
                fi
              done

              echo "Assigning strict bucket isolation..."
              weed shell -master=$MASTER <<EOF
              s3.configure -user=velero -buckets=velero -apply
              EOF

              echo "velero S3 service account and buckets provisioned!"
