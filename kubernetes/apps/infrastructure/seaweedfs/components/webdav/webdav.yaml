apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-webdav
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: webdav
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: webdav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/component: webdav
    spec:
      containers:
        - name: webdav
          image: chrislusf/seaweedfs:4.39
          command:
            - "/bin/sh"
            - "-ec"
            - "exec /usr/bin/weed -logdir=/logs/ -v=1 webdav -port=7333 -filer=seaweedfs-filer-client.storage:8888"
          ports:
            - name: swfs-webdav
              containerPort: 7333
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 7333
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 7333
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: logs
              mountPath: /logs/
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-webdav
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: webdav
spec:
  type: ClusterIP
  ports:
    - port: 7333
      targetPort: 7333
      protocol: TCP
      name: swfs-webdav
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: webdav
