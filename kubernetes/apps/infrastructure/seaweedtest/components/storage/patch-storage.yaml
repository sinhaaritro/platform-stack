apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedtest-seaweedfs-master
  namespace: storage-test
spec:
  volumeClaimTemplates:
    - metadata:
        name: data-storage-test
      apiVersion: v1
      kind: PersistentVolumeClaim
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path
    - metadata:
        name: seaweedfs-master-log-volume
      apiVersion: v1
      kind: PersistentVolumeClaim
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path
---
