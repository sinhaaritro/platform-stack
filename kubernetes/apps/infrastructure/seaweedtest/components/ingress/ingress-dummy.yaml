apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedtest-volume-dummy
  namespace: storage-test
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - volume.seaweedtest-dummy.example.com
        - "*.volume.seaweedtest-dummy.example.com"
      secretName: seaweedtest-volume-dummy-tls
  rules:
    - host: volume.seaweedtest-dummy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedtest-seaweedfs-volume
                port:
                  number: 8080
    - host: "*.volume.seaweedtest-dummy.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedtest-seaweedfs-volume
                port:
                  number: 8080
