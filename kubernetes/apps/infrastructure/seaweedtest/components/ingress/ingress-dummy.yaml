apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedtest-master-dummy
  namespace: storage-test
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - seaweedtest-dummy.example.com
      secretName: seaweedtest-master-dummy-tls
  rules:
    - host: seaweedtest-dummy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedtest-seaweedfs-master
                port:
                  number: 9333
---
