apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedtest-s3-config-job
  namespace: storage-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    metadata:
      annotations:
        platform.stack/revision: "1"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: s3-config
          image: chrislusf/seaweedfs:4.39
          imagePullPolicy: IfNotPresent
          env:
            - name: MIMIR_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: mimir-access-key
            - name: MIMIR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: mimir-secret-key
            - name: LOKI_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: loki-access-key
            - name: LOKI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: loki-secret-key
            - name: ALERTMANAGER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: alertmanager-access-key
            - name: ALERTMANAGER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: alertmanager-secret-key
            - name: VELERO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: velero-access-key
            - name: VELERO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: velero-secret-key
            - name: ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: admin-access-key
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedtest-s3-service-accounts
                  key: admin-secret-key
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for SeaweedFS Master..."
              MASTER="seaweedtest-seaweedfs-master:9333"

              until echo "s3.bucket.list" | weed shell -master=$MASTER >/dev/null 2>&1; do
                echo "Waiting for master at $MASTER..."
                sleep 2
              done

              echo "Configuring Programmatic S3 Service Accounts from Secret..."
              weed shell -master=$MASTER <<EOF
              s3.configure -user=mimir -access_key=\$MIMIR_ACCESS_KEY -secret_key=\$MIMIR_SECRET_KEY -actions=Read,Write,List,Tagging -apply
              s3.configure -user=loki -access_key=\$LOKI_ACCESS_KEY -secret_key=\$LOKI_SECRET_KEY -actions=Read,Write,List,Tagging -apply
              s3.configure -user=alertmanager -access_key=\$ALERTMANAGER_ACCESS_KEY -secret_key=\$ALERTMANAGER_SECRET_KEY -actions=Read,Write,List,Tagging -apply
              s3.configure -user=velero -access_key=\$VELERO_ACCESS_KEY -secret_key=\$VELERO_SECRET_KEY -actions=Read,Write,List,Tagging -apply
              s3.configure -user=admin -access_key=\$ADMIN_ACCESS_KEY -secret_key=\$ADMIN_SECRET_KEY -actions=Read,Write,List,Tagging,Admin -apply
              EOF

              echo "Creating Scoped Buckets..."
              # Mimir Buckets
              for BUCKET in mimir-tsdb mimir-ruler mimir-alertmanager; do
                echo "Checking bucket \$BUCKET..."
                if ! echo "s3.bucket.list" | weed shell -master=$MASTER | grep -q "\$BUCKET"; then
                  echo "Creating bucket \$BUCKET for user mimir..."
                  echo "s3.bucket.create -name=\$BUCKET -owner=mimir" | weed shell -master=$MASTER
                else
                  echo "Bucket \$BUCKET already exists."
                fi
              done

              # Loki Buckets
              for BUCKET in loki-chunks loki-ruler loki-admin; do
                echo "Checking bucket \$BUCKET..."
                if ! echo "s3.bucket.list" | weed shell -master=$MASTER | grep -q "\$BUCKET"; then
                  echo "Creating bucket \$BUCKET for user loki..."
                  echo "s3.bucket.create -name=\$BUCKET -owner=loki" | weed shell -master=$MASTER
                else
                  echo "Bucket \$BUCKET already exists."
                fi
              done

              # Alertmanager Buckets
              for BUCKET in alertmanager; do
                echo "Checking bucket \$BUCKET..."
                if ! echo "s3.bucket.list" | weed shell -master=$MASTER | grep -q "\$BUCKET"; then
                  echo "Creating bucket \$BUCKET for user alertmanager..."
                  echo "s3.bucket.create -name=\$BUCKET -owner=alertmanager" | weed shell -master=$MASTER
                else
                  echo "Bucket \$BUCKET already exists."
                fi
              done

              # Velero Buckets
              for BUCKET in velero; do
                echo "Checking bucket \$BUCKET..."
                if ! echo "s3.bucket.list" | weed shell -master=$MASTER | grep -q "\$BUCKET"; then
                  echo "Creating bucket \$BUCKET for user velero..."
                  echo "s3.bucket.create -name=\$BUCKET -owner=velero" | weed shell -master=$MASTER
                else
                  echo "Bucket \$BUCKET already exists."
                fi
              done

              echo "Assigning Strict Bucket Isolation..."
              weed shell -master=$MASTER <<EOF
              s3.configure -user=mimir -buckets=mimir-tsdb,mimir-ruler,mimir-alertmanager -apply
              s3.configure -user=loki -buckets=loki-chunks,loki-ruler,loki-admin -apply
              s3.configure -user=alertmanager -buckets=alertmanager -apply
              s3.configure -user=velero -buckets=velero -apply
              EOF

              echo "S3 Service Accounts and Buckets successfully provisioned!"
