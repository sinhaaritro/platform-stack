apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedtest-seaweedfs-webdav
  namespace: storage-test
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: webdav
    app.kubernetes.io/instance: seaweedtest
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: webdav
      app.kubernetes.io/instance: seaweedtest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/component: webdav
        app.kubernetes.io/instance: seaweedtest
    spec:
      containers:
        - name: webdav
          image: chrislusf/seaweedfs:4.39
          imagePullPolicy: IfNotPresent
          command:
            - "/usr/bin/weed"
            - "webdav"
            - "-filer=seaweedtest-seaweedfs-filer:8888"
            - "-port=7333"
            - "-ip.bind=0.0.0.0"
          ports:
            - containerPort: 7333
              name: http-webdav
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 7333
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7333
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedtest-seaweedfs-webdav
  namespace: storage-test
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: webdav
    app.kubernetes.io/instance: seaweedtest
spec:
  ports:
    - port: 7333
      targetPort: 7333
      name: http-webdav
      protocol: TCP
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: webdav
    app.kubernetes.io/instance: seaweedtest
