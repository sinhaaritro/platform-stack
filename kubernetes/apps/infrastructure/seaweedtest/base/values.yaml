master:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  data:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "1Gi"
  logs:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "1Gi"

volume:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  extraArgs:
    - "-publicUrl=${POD_NAME}.volume.seaweedtest.hyperion.aritrosinha.dpdns.org"
  dataDirs:
    - name: data
      type: "persistentVolumeClaim"
      storageClass: "longhorn0rep"
      size: "10Gi"
  idx:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "1Gi"
  logs:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "1Gi"

filer:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  data:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "2Gi"
  logs:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "1Gi"

admin:
  enabled: true
  port: 23646
  grpcPort: 33646
  adminUser: "admin"
  adminPassword: "admin"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  data:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "2Gi"
  logs:
    type: "persistentVolumeClaim"
    storageClass: "longhorn0rep"
    size: "2Gi"
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: admin
                app.kubernetes.io/instance: {{ .Release.Name }}
                app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
            topologyKey: kubernetes.io/hostname

s3:
  enabled: true
  port: 8333
  metricsPort: 9327
  enableAuth: false
  bindAddress: "0.0.0.0"
  domainName: ""
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  logs:
    type: "emptyDir"
