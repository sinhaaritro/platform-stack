apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      labelSelector: app=nfs-subdir-external-provisioner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nfs-provisioner-nfs-subdir-external-provisioner
      spec:
        template:
          spec:
            containers:
              - name: nfs-subdir-external-provisioner
                env:
                  - name: NFS_SERVER
                    value: "192.168.0.2"
                  - name: NFS_PATH
                    value: /WD4TB/shared
  - target:
      kind: PersistentVolume
      labelSelector: app=nfs-subdir-external-provisioner
    patch: |-
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: pv-nfs-provisioner-nfs-subdir-external-provisioner
      spec:
        nfs:
          server: 192.168.0.2
          path: /WD4TB/shared