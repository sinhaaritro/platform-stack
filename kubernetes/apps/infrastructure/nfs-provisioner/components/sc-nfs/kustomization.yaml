apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: StorageClass
      name: nfs
    patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: nfs
      reclaimPolicy: Retain
      parameters:
        archiveOnDelete: "true"
        pathPattern: "${.PVC.namespace}/${.PVC.name}"