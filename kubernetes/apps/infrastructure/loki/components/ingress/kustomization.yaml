apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
metadata:
  name: ingress
# Template / dummy values. To expose loki on a cluster, copy this folder to
# clusters/<name>/loki/components/ingress and replace every "dummy" value
# (host + cluster-issuer) with the cluster-specific ones, one ingress+cert pair
# per domain.
resources:
  - ingress-dummy.yaml
  - cert-dummy.yaml
