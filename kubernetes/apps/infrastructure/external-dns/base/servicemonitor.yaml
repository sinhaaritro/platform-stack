apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-dns-metrics
  namespace: external-dns
  labels:
    release: mimir
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  namespaceSelector:
    matchNames:
      - external-dns
  endpoints:
    - port: http-metrics
      interval: 15s
      path: /metrics
