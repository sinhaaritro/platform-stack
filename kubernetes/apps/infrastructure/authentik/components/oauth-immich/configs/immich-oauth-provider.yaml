# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: immich-oauth-setup
entries:
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    id: immich-provider
    identifiers:
      name: Immich
    attrs:
      client_id: !Env IMMICH_OAUTH_CLIENT_ID
      client_secret: !Env IMMICH_OAUTH_CLIENT_SECRET
      client_type: confidential
      # Stable across Authentik DB restores: the OAuth `sub` is a hash of the
      # Authentik user UUID, so restoring Authentik (not rebuilding it fresh)
      # keeps Immich's stored oauthId valid.
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      invalidation_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-invalidation-flow],
        ]
      # Both Immich hostnames serve the same instance, so both web origins
      # must be accepted. /auth/login is the web callback; /user-settings is
      # used when linking an existing account. Mobile uses the custom scheme.
      redirect_uris:
        - matching_mode: strict
          url: "app.immich:///oauth-callback"
        - matching_mode: strict
          url: "https://immich.hyperion.aritrosinha.dpdns.org/auth/login"
        - matching_mode: strict
          url: "https://immich.hyperion.aritrosinha.dpdns.org/user-settings"
        - matching_mode: strict
          url: "https://immich-hyperion.strawslabs.com/auth/login"
        - matching_mode: strict
          url: "https://immich-hyperion.strawslabs.com/user-settings"
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, "authentik Self-signed Certificate"],
        ]

  - model: authentik_core.application
    state: present
    id: immich-app
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      meta_launch_url: "https://immich.hyperion.aritrosinha.dpdns.org/auth/login?autoLaunch=1"
      meta_icon: "https://raw.githubusercontent.com/immich-app/immich/main/docs/static/img/favicon.png"
