apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: personal

resources:
  - cronjob.yaml
  # restore-job.yaml is intentionally NOT listed — it is a manual, on-demand manifest.

# Default (dummy) destination. Overridden per cluster in
# clusters/<cluster>/immich/components/rclone-backup.
configMapGenerator:
  - name: immich-backup-config
    literals:
      - DESTINATION=REPLACE_ME_REMOTE:REPLACE_ME_BUCKET/immich
generatorOptions:
  disableNameSuffixHash: true
