apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-rclone-backup
  namespace: personal
spec:
  schedule: "0 0 1 * *" # monthly — 1st of the month at 00:00
  suspend: true # disabled by default; flip to false once DESTINATION is set for the cluster
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "Syncing Immich /data to $DESTINATION ..."
                  rclone sync /data "$DESTINATION" \
                    --exclude "/thumbs/**" \
                    --exclude "/encoded-video/**" \
                    --transfers 4 --checkers 8 --verbose
              env:
                # Destination is a variable — overridden per cluster (see clusters/<cluster>/immich/components/rclone-backup)
                - name: DESTINATION
                  valueFrom:
                    configMapKeyRef:
                      name: immich-backup-config
                      key: DESTINATION
                # rclone remote "aws" (S3). Credentials come from the cluster's sealed secret.
                - name: RCLONE_CONFIG_AWS_TYPE
                  value: s3
                - name: RCLONE_CONFIG_AWS_PROVIDER
                  value: AWS
                - name: RCLONE_CONFIG_AWS_REGION
                  value: ap-southeast-1
                - name: RCLONE_CONFIG_AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: immich-aws-creds
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: immich-aws-creds
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich
