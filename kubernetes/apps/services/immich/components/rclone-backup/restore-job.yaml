# Manual, on-demand restore of the Immich dataset from the rclone destination.
#
# NOT referenced by kustomization.yaml on purpose — applying this manifest starts
# the restore immediately, so it must never be picked up by ArgoCD auto-sync.
#
# Usage (see docs/runbooks/restore-immich.md):
#   kubectl apply -f restore-job.yaml
#   kubectl -n personal logs -f job/immich-rclone-restore
#   kubectl -n personal delete job/immich-rclone-restore
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-rclone-restore
  namespace: personal
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: rclone
          image: rclone/rclone:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Restoring Immich /data from $DESTINATION ..."
              rclone copy "$DESTINATION" /data \
                --transfers 4 --checkers 8 --verbose
              echo "Restore complete. Fixing permissions..."
              chown -R 1000:1000 /data
          env:
            - name: DESTINATION
              valueFrom:
                configMapKeyRef:
                  name: immich-backup-config
                  key: DESTINATION
            - name: RCLONE_CONFIG_AWS_TYPE
              value: s3
            - name: RCLONE_CONFIG_AWS_PROVIDER
              value: AWS
            - name: RCLONE_CONFIG_AWS_REGION
              value: ap-southeast-1
            - name: RCLONE_CONFIG_AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: immich-aws-creds
                  key: AWS_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-aws-creds
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich
