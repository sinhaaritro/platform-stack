controllers:
  main:
    containers:
      main:
        # DB and Redis credentials are injected by components/secrets
        env:
          # Required for the Prometheus metrics endpoint. Immich defaults the
          # listen host to "::", which the OTel Prometheus exporter turns into
          # the invalid base URL "http://:::8081/", so every scrape returns 400.
          IMMICH_HOST: "0.0.0.0"
        image:
          tag: v3.4.2

    initContainers:
      init-storage:
        image:
          repository: busybox
          tag: latest
        command:
          - sh
          - -c
          - |
            if [ -d /data ]; then
              mkdir -p /data/library /data/upload /data/profile /data/thumbs /data/encoded-video /data/backups
              for dir in library upload profile thumbs encoded-video backups; do
                touch "/data/$dir/.immich"
              done
              # Generate Kopia ignore file to exclude massive media folders from Velero backups
              printf "library/\nencoded-video/\nthumbs/\n" > /data/.kopiaignore
              chown -R 1000:1000 /data
            else
              echo "/data not found, skipping initialization"
            fi
        securityContext:
          runAsUser: 0

immich:
  metrics:
    enabled: true

  # All Immich data stored on NFS PVC (immich, 50Gi).
  # Velero backup to be configured separately.
  persistence:
    library:
      existingClaim: immich

server:
  ingress:
    main:
      enabled: false
      annotations: {}
      hosts: []

defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"

machine-learning:
  persistence:
    cache:
      type: persistentVolumeClaim
      existingClaim: immich-machine-learning-cache
