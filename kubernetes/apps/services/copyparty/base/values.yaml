ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: copyparty.hyperion.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePortName: http
  tls:
    - hosts:
        - copyparty.hyperion.example.com
      secretName: copyparty-tls

volumeConfig:
  userData:
    volumeMount:
      name: "user-data"
      mountPath: "/w"
    volume:
      name: "user-data"
      emptyDir: null
      nfs:
        server: "192.168.0.53"
        path: "/export/data"
  appData:
    persistence:
      enabled: true
      pvcName: "app-data"
      accessModes:
        - "ReadWriteOnce"
      size: "1Gi"
      storageClass: "longhorn"

resources:
  limits:
    memory: "1Gi"
  requests:
    cpu: "100m"
    memory: "128Mi"
