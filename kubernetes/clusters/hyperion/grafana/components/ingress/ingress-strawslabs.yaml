apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-strawslabs
  namespace: monitoring
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "grafana-hyperion.strawslabs.com"
      secretName: grafana-cert-strawslabs-tls
  rules:
    - host: "grafana-hyperion.strawslabs.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80