apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-cert-aritrosinha
  namespace: monitoring
  labels:
    backuplabel.certificate: "true"
spec:
  secretName: grafana-cert-aritrosinha-tls
  issuerRef:
    name: letsencrypt-prod-aritrosinha
    kind: ClusterIssuer
  dnsNames:
    - "grafana.hyperion.aritrosinha.dpdns.org"
  secretTemplate:
    labels:
      backuplabel.certificate: "true"