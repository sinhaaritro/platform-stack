apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: grafana-dashboard-backup-dr
    namespace: monitoring
    files:
      - sre/S1-backup-and-disaster-recovery.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "SRE / Operations"

  - name: grafana-dashboard-external-infra
    namespace: monitoring
    files:
      - sre/S6-external-infrastructure.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "SRE / Operations"

  - name: grafana-dashboard-cluster-health
    namespace: monitoring
    files:
      - sre/S2-cluster-and-node-health.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "SRE / Operations"

  - name: grafana-dashboard-platform-overview
    namespace: monitoring
    files:
      - executive/E1-platform-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Executive"
