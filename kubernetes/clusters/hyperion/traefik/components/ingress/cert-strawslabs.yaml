apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-cert-strawslabs
  namespace: networking
  labels:
    backuplabel.certificate: "true"
spec:
  secretName: traefik-cert-strawslabs-tls
  issuerRef:
    name: letsencrypt-prod-strawslabs
    kind: ClusterIssuer
  dnsNames:
    - "traefik-hyperion.strawslabs.com"
  secretTemplate:
    labels:
      backuplabel.certificate: "true"
