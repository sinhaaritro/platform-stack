apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-cert-aritrosinha
  namespace: networking
  labels:
    backuplabel.certificate: "true"
spec:
  secretName: traefik-cert-aritrosinha-tls
  issuerRef:
    name: letsencrypt-prod-aritrosinha
    kind: ClusterIssuer
  dnsNames:
    - "traefik.hyperion.aritrosinha.dpdns.org"
  secretTemplate:
    labels:
      backuplabel.certificate: "true"
