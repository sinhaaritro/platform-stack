apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mimir-cert-strawslabs
  namespace: monitoring
  labels:
    backuplabel.certificate: "true"
spec:
  secretName: mimir-cert-strawslabs-tls
  issuerRef:
    name: letsencrypt-prod-strawslabs
    kind: ClusterIssuer
  dnsNames:
    - "mimir-hyperion.strawslabs.com"
  secretTemplate:
    labels:
      backuplabel.certificate: "true"
