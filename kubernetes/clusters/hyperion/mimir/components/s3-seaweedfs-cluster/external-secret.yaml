apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hyperion-mimir-s3
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: mimir-storage-secret-store
  target:
    name: hyperion-mimir-s3
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hyperion-mimir-s3
