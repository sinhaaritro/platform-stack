apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: "\nactivity_tracker:\n  filepath: /active-query-tracker/activity.log\nalertmanager:\n  data_dir: /data\n  enable_api: true\n  external_url: /alertmanager\n  fallback_config_file: /configs/alertmanager_fallback_config.yaml\nalertmanager_storage:\n  s3:\n    bucket_name: hyperion-mimir-alertmanager\nblocks_storage:\n  backend: s3\n  bucket_store:\n    sync_dir: /data/tsdb-sync\n  s3:\n    bucket_name: hyperion-mimir-tsdb\n  tsdb:\n    dir: /data/tsdb\n    head_compaction_interval: 15m\n    wal_replay_concurrency: 3\ncommon:\n  storage:\n    backend: s3\n    s3:\n      access_key_id: mimir_61c0d8df6600f57817e1\n      endpoint: seaweedfs-s3.storage.svc:8333\n      insecure: true\n      region: us-east-1\n      secret_access_key: 0085705b3e63c029154c63e722ca7d0a3d79fe96\n      signature_version: v4\ncompactor:\n  compaction_interval: 30m\n  data_dir: /data\n  deletion_delay: 2h\n  first_level_compaction_wait_period: 25m\n  max_closing_blocks_concurrency: 2\n  max_opening_blocks_concurrency: 4\n  sharding_ring:\n    heartbeat_period: 1m\n    heartbeat_timeout: 4m\n    wait_stability_min_duration: 1m\n  symbols_flushers_concurrency: 4\ndistributor:\n  remote_timeout: 5s\n  ring:\n    heartbeat_period: 1m\n    heartbeat_timeout: 4m\nfrontend:\n  parallelize_shardable_queries: true\n  scheduler_address: mimir-query-scheduler-headless.monitoring.svc:9095\nfrontend_worker:\n  grpc_client_config:\n    max_send_msg_size: 419430400\n  scheduler_address: mimir-query-scheduler-headless.monitoring.svc:9095\ningest_storage:\n  enabled: true\n  kafka:\n    address: mimir-kafka.monitoring.svc.cluster.local.:9092\n    auto_create_topic_default_partitions: 100\n    auto_create_topic_enabled: true\n    topic: mimir-ingest\ningester:\n  push_grpc_method_enabled: false\n  ring:\n    final_sleep: 0s\n    heartbeat_period: 2m\n    heartbeat_timeout: 10m\n    num_tokens: 512\n    replication_factor: 1\n    tokens_file_path: /data/tokens\n    unregister_on_shutdown: false\ningester_client:\n  grpc_client_config:\n    max_recv_msg_size: 104857600\n    max_send_msg_size: 104857600\nlimits:\n  ingestion_burst_size: 200000\n  ingestion_rate: 100000\n  max_cache_freshness: 10m\n  max_global_series_per_user: 1000000\n  max_query_parallelism: 240\n  max_total_query_length: 12000h\nmemberlist:\n  abort_if_cluster_join_fails: false\n  compression_enabled: false\n  join_members:\n  - dns+mimir-gossip-ring.monitoring.svc.cluster.local.:7946\nquerier:\n  max_concurrent: 16\nquery_scheduler:\n  max_outstanding_requests_per_tenant: 800\nruler:\n  alertmanager_url: dnssrvnoa+http://_http-metrics._tcp.mimir-alertmanager-headless.monitoring.svc.cluster.local./alertmanager\n  enable_api: true\n  rule_path: /data\nruler_storage:\n  s3:\n    bucket_name: hyperion-mimir-ruler\nruntime_config:\n  file: /var/mimir/runtime.yaml\nstore_gateway:\n  sharding_ring:\n    heartbeat_period: 1m\n    heartbeat_timeout: 10m\n    tokens_file_path: /data/tokens\n    unregister_on_shutdown: false\n    wait_stability_min_duration: 1m\nusage_stats:\n  installation_mode: helm"
