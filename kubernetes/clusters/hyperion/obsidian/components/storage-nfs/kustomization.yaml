apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: PersistentVolumeClaim
      name: obsidian-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: obsidian
      - op: replace
        path: /spec/storageClassName
        value: nfs
  - target:
      kind: Deployment
      name: obsidian
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: obsidian
