apiVersion: batch/v1
kind: Job
metadata:
  name: s3-velero-provision
  namespace: storage
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      annotations:
        platform.stack/revision: "3"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: s3-provision
          image: seaweedfs-placeholder
          imagePullPolicy: IfNotPresent
          env:
            # ---- hyperion-specific values ----
            - name: VELERO_USER
              value: "hyperion-velero"
            - name: VELERO_BUCKET
              value: "hyperion-velero"
            - name: S3_SECRET_NAME
              value: "hyperion-velero-s3"
            - name: S3_ACTIONS
              value: "Read,Write,List,Tagging"
            - name: QUOTA
              value: "50G"
            # ---- Credentials (referenced by name; keys are fixed: access_key/secret_key) ----
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperion-velero-s3
                  key: access_key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperion-velero-s3
                  key: secret_key
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for SeaweedFS Master..."
              MASTER="seaweedfs-master:9333"

              until echo "s3.bucket.list" | weed shell -master=$MASTER >/dev/null 2>&1; do
                echo "Waiting for master at $MASTER..."
                sleep 2
              done

              echo "Configuring S3 user $VELERO_USER..."
              weed shell -master=$MASTER <<EOF
              s3.configure -user=$VELERO_USER -access_key=$S3_ACCESS_KEY -secret_key=$S3_SECRET_KEY -actions=$S3_ACTIONS -apply
              EOF

              # Remove the legacy literal key left behind by the old s3-config
              # job, whose heredoc failed to expand \$VELERO_ACCESS_KEY and stored
              # the literal string as the access key.
              echo "Cleaning up legacy literal access keys..."
              echo "s3.accesskey.list -user=$VELERO_USER" | weed shell -master=$MASTER 2>/dev/null \
                | awk 'NR>1 {print $1}' \
                | while read -r K; do
                    case "$K" in
                      "$S3_ACCESS_KEY") ;;
                      *) echo "Deleting stale key: $K"; echo "s3.accesskey.delete -user=$VELERO_USER -access_key=$K" | weed shell -master=$MASTER ;;
                    esac
                  done

              echo "Creating scoped buckets..."
              BUCKETS="$VELERO_BUCKET"
              # Legacy single-name bucket, only if it differs from the per-cluster name
              if [ "$VELERO_BUCKET" != "velero" ]; then
                BUCKETS="$VELERO_BUCKET velero"
              fi
              for BUCKET in $BUCKETS; do
                if ! echo "s3.bucket.list" | weed shell -master=$MASTER | grep -q "$BUCKET"; then
                  if [ "$BUCKET" = "$VELERO_BUCKET" ]; then
                    echo "Creating bucket $BUCKET for user $VELERO_USER (with Object Lock)..."
                    echo "s3.bucket.create -name=$BUCKET -owner=$VELERO_USER --withLock" | weed shell -master=$MASTER
                  else
                    echo "Creating legacy bucket $BUCKET for user $VELERO_USER..."
                    echo "s3.bucket.create -name=$BUCKET -owner=$VELERO_USER" | weed shell -master=$MASTER
                  fi
                else
                  echo "Bucket $BUCKET already exists."
                  if [ "$BUCKET" = "$VELERO_BUCKET" ]; then
                    echo "Enabling Object Lock on bucket $BUCKET..."
                    echo "s3.bucket.lock -name=$BUCKET -enable" | weed shell -master=$MASTER
                  fi
                fi
              done

              echo "Applying quota ($QUOTA) to bucket $VELERO_BUCKET..."
              echo "fs.configure -locationPrefix=/buckets/$VELERO_BUCKET/ -ttl=$QUOTA -apply" | weed shell -master=$MASTER

              echo "Assigning strict bucket isolation..."
              weed shell -master=$MASTER <<EOF
              s3.configure -user=$VELERO_USER -buckets=$VELERO_BUCKET -apply
              EOF

              echo "$VELERO_USER S3 service account and buckets provisioned!"
