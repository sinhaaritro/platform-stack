apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# hyperion-specific mimir S3 bucket provisioner.
# The Job is a full copy of the shared template
# (apps/infrastructure/seaweedfs/components/mimir/job.yaml) with the
# hyperion values filled in. The image is replaced at the app level
# (see clusters/hyperion/seaweedfs/kustomization.yaml).
resources:
  - sealed-mimir-s3.yaml
  - job.yaml
