apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-volume-strawslabs
  namespace: storage
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "volume.seaweedfs-hyperion.strawslabs.com"
        - "*.volume.seaweedfs-hyperion.strawslabs.com"
      secretName: seaweedfs-volume-strawslabs-tls
  rules:
    - host: "volume.seaweedfs-hyperion.strawslabs.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-volume
                port:
                  number: 8080
    - host: "*.volume.seaweedfs-hyperion.strawslabs.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-volume
                port:
                  number: 8080
