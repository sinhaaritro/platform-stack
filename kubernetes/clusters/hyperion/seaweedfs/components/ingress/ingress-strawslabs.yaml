apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-master-strawslabs
  namespace: storage
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "seaweedfs-hyperion.strawslabs.com"
      secretName: seaweedfs-master-strawslabs-tls
  rules:
    - host: "seaweedfs-hyperion.strawslabs.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-master
                port:
                  number: 9333
---
