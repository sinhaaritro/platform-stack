apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-master-aritrosinha
  namespace: storage
  labels:
    backuplabel.certificate: "true"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "seaweedfs.hyperion.aritrosinha.dpdns.org"
      secretName: seaweedfs-master-aritrosinha-tls
  rules:
    - host: "seaweedfs.hyperion.aritrosinha.dpdns.org"
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-admin
                port:
                  number: 23646
          - path: /filer
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-filer
                port:
                  number: 8888
          - path: /volume
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-volume
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-master
                port:
                  number: 9333
---
