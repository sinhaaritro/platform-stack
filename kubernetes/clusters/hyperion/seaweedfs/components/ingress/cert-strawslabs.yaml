apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seaweedfs-master-tls
  namespace: storage
  labels:
    backuplabel.certificate: "true"
spec:
  secretName: seaweedfs-master-tls
  issuerRef:
    name: letsencrypt-prod-strawslabs
    kind: ClusterIssuer
  dnsNames:
    - "seaweedfs-hyperion.strawslabs.com"
  secretTemplate:
    labels:
      backuplabel.certificate: "true"
---
