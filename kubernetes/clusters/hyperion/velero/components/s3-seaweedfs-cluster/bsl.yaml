apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: backup
  annotations:
    # Velero boots at wave 2 (DR-first), before seaweedfs (wave 7). This
    # in-cluster BSL reports Error until seaweedfs + its S3 creds exist. Exclude
    # it from the app's health so the transient Error does not hold the
    # WaitFor gate and block wave 3+ apps. The BSL still applies and self-heals
    # to Available once seaweedfs is up. (AWS BSL keeps its real health.)
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  provider: aws
  default: true
  objectStorage:
    bucket: hyperion-velero
  config:
    region: us-east-1
    s3ForcePathStyle: "true"
    s3Url: http://seaweedfs-s3.storage.svc:8333
  credential:
    name: hyperion-velero-s3
    key: cloud
