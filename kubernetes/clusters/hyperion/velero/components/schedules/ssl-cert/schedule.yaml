apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: ssl-certs
  namespace: backup
spec:
  schedule: "30 21 * * 6" # 03:00 AM IST (21:30 UTC) on Sundays
  template:
    includedNamespaces:
      - "*"
    includedResources:
      - secrets
      - certificates.cert-manager.io
    excludedResources:
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    labelSelector:
      matchLabels:
        backuplabel.certificate: "true"
    storageLocation: aws
    ttl: 1440h0m0s # 60 days retention (safe buffer for 90-day certs)
    snapshotVolumes: false # Metadata only, no expensive disk snapshots
