apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-security
  namespace: backup
spec:
  schedule: "0 21 * * *" # 02:30 AM IST (21:00 UTC)
  template:
    includedNamespaces:
      - security
    storageLocation: aws
    defaultVolumesToFsBackup: true
    ttl: 336h0m0s # 14 daily copies (2 weeks)
