apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedtest-master-aritrosinha
  namespace: storage-test
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    link.argocd.argoproj.io/external-link: "http://seaweedtest.hyperion.aritrosinha.dpdns.org/"
spec:
  ingressClassName: traefik
  rules:
    - host: "seaweedtest.hyperion.aritrosinha.dpdns.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedtest-seaweedfs-master
                port:
                  number: 9333
---
apiVersion: networking.k8s.io/v1
kind: Ingress
