  name: seaweedtest-volume-aritrosinha
  namespace: storage-test
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    argocd.argoproj.io/ignore-default-links: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: "*.volume.seaweedtest.hyperion.aritrosinha.dpdns.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedtest-seaweedfs-volume
                port:
                  number: 8080
