apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-cert-strawslabs
  namespace: longhorn-system
  labels:
    backuplabel.certificate: "true"
spec:
  secretName: longhorn-cert-strawslabs-tls
  issuerRef:
    name: letsencrypt-prod-strawslabs
    kind: ClusterIssuer
  dnsNames:
    - "longhorn-hyperion.strawslabs.com"
  secretTemplate:
    labels:
      backuplabel.certificate: "true"
