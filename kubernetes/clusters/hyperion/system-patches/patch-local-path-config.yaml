apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [],
      "storageClassConfigs": {
        "local-path": {
          "nodePathMap": [
            {
              "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
              "paths": ["/var/lib/rancher/k3s/storage"]
            }
          ]
        },
        "local-path-seaweedfs": {
          "nodePathMap": [
            {
              "node": "hyperion-01",
              "paths": ["/data/storage/seaweedfs"]
            },
            {
              "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
              "paths": ["/data/storage/seaweedfs"]
            }
          ]
        }
      }
    }
